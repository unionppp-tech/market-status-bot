name: Asset Squeeze Momentum Report

on:
  workflow_dispatch:   # 수동 실행
  schedule:
    - cron: '0 13 * * *'   # 매일 22:00 KST (UTC 기준)

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 레포지토리 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ 필요한 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyupbit pandas lxml openpyxl html5lib
          pip install git+https://github.com/FinanceData/FinanceDataReader.git

      # 4️⃣ Asset Squeeze Momentum 실행
      - name: Run Asset Squeeze Reporter
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 파일 경로 확인
          if [ -f "upbit_eth_price.py" ]; then
            python upbit_eth_price.py
          else
            echo "❌ upbit_eth_price.py 파일을 찾을 수 없습니다."
            exit 1
