name: Asset Squeeze Momentum Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'   # 매일 22:00 KST (UTC 기준)

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyupbit pandas FinanceDataReader

      - name: Run Asset Squeeze Reporter
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/upbit_eth_price.py
