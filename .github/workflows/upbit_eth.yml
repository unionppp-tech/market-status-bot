name: Asset Squeeze Momentum Report

on:
  workflow_dispatch:   # 수동 실행
  schedule:
    - cron: '0 12 * * *'   # 매일 21:00 KST (UTC 12:00)

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyupbit pandas numpy lxml openpyxl html5lib
          pip install git+https://github.com/FinanceData/FinanceDataReader.git
      - name: Run Asset Squeeze Reporter
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/upbit_eth_price.py
